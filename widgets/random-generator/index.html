<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Random Generator | Michaela OS</title>

    <link
      rel="stylesheet"
      href="/css/themes.css"
    />

    <link
      rel="stylesheet"
      href="/css/random-generator-widget.css"
    />
  </head>

  <body>
    <main
      class="random-generator"
      data-theme="cozy-autumn"
    >
      <section
        class="random-generator__card"
        aria-labelledby="random-generator-title"
      >
        <header class="random-generator__header">
          <div>
            <p class="random-generator__eyebrow">
              Michaela OS
            </p>

            <h1
              class="random-generator__title"
              id="random-generator-title"
            >
              Random Generator
            </h1>
          </div>

          <div
            class="random-generator__icon"
            aria-hidden="true"
          >
            ✨
          </div>
        </header>

        <div
          class="random-generator__divider"
          aria-hidden="true"
        ></div>

        <div class="random-generator__controls">
          <label
            class="random-generator__label"
            for="category-select"
          >
            Choose a category
          </label>

          <select
            class="random-generator__select"
            id="category-select"
          >
            <option value="">
              Surprise me
            </option>

            <option value="5 minute journal prompt">
              5 minute journal prompt
            </option>
          </select>
        </div>

        <section
          class="random-generator__result"
          id="generator-result"
          aria-live="polite"
        >
          <p class="random-generator__result-label">
            Your pick
          </p>

          <p
            class="random-generator__result-text"
            id="generator-result-text"
          >
            Choose a category and let fate handle the paperwork.
          </p>

          <p
            class="random-generator__result-category"
            id="generator-result-category"
            hidden
          ></p>
        </section>

        <button
          class="random-generator__button"
          id="generate-button"
          type="button"
        >
          <span aria-hidden="true">🎲</span>

          <span id="generate-button-text">
            Generate
          </span>
        </button>

        <p
          class="random-generator__status"
          id="generator-status"
          role="status"
        ></p>
      </section>
    </main>

    <script
      src="/js/random-generator.js"
      defer
    ></script>
  </body>
</html>
