<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Focus Music</title>

  <link
    rel="stylesheet"
    href="../../css/themes.css"
  >

  <link
    rel="stylesheet"
    href="../../css/focus-music-widget.css"
  >
</head>

<body>

  <main class="music-widget">

    <section
      id="musicCard"
      class="music-card"
      data-theme="lofi"
    >

      <header class="music-header">

        <div>
          <p class="music-eyebrow">
            Productivity
          </p>

          <h1>
            Focus Radio
          </h1>
        </div>

        <div
          id="headerIcon"
          class="music-header-icon"
          aria-hidden="true"
        >
          🎧
        </div>

      </header>

      <div class="music-divider"></div>

      <section class="daily-pick">

        <p class="section-label">
          <span aria-hidden="true">✨</span>
          Today’s Focus
        </p>

        <button
          id="dailyPickButton"
          class="daily-pick-button"
          type="button"
        >

          <span
            id="dailyPickIcon"
            class="daily-pick-icon"
            aria-hidden="true"
          >
            🎧
          </span>

          <span class="daily-pick-copy">

            <strong id="dailyPickName">
              Lo-fi Focus
            </strong>

            <small id="dailyPickDescription">
              Today’s recommended station
            </small>

          </span>

          <span
            class="daily-pick-action"
            aria-hidden="true"
          >
            Play
          </span>

        </button>

      </section>

      <div class="music-divider"></div>

      <section class="station-section">

        <p class="section-label">
          Choose a Station
        </p>

        <div
          id="stationButtons"
          class="station-buttons"
          role="list"
          aria-label="Focus radio stations"
        ></div>

      </section>

      <div class="music-divider"></div>

      <section class="now-playing">

        <div
          id="stationArtwork"
          class="station-artwork"
          aria-hidden="true"
        >
          🎧
        </div>

        <div class="station-information">

          <p
            id="stationStatusLabel"
            class="station-status-label"
          >
            Selected Station
          </p>

          <h2 id="stationName">
            Lo-fi Focus
          </h2>

          <p id="stationDescription">
            Warm downtempo music for steady focus.
          </p>

        </div>

      </section>

      <section class="radio-controls">

        <button
          id="playButton"
          class="primary-control"
          type="button"
        >
          <span
            id="playButtonIcon"
            aria-hidden="true"
          >
            ▶
          </span>

          <span id="playButtonText">
            Play Station
          </span>
        </button>

        <button
          id="stopButton"
          class="secondary-control"
          type="button"
          disabled
        >
          <span aria-hidden="true">
            ■
          </span>

          Stop
        </button>

      </section>

      <section class="volume-section">

        <div class="volume-heading">

          <label for="volumeSlider">
            Volume
          </label>

          <span id="volumeValue">
            65%
          </span>

        </div>

        <div class="volume-control">

          <button
            id="muteButton"
            class="mute-button"
            type="button"
            aria-label="Mute focus radio"
          >
            <span
              id="muteIcon"
              aria-hidden="true"
            >
              🔊
            </span>
          </button>

          <input
            id="volumeSlider"
            type="range"
            min="0"
            max="100"
            value="65"
            step="1"
            aria-label="Focus radio volume"
          >

        </div>

      </section>

      <section
        id="radioMessage"
        class="radio-message"
        role="status"
        aria-live="polite"
      >

        <span
          id="radioMessageIcon"
          aria-hidden="true"
        >
          🌿
        </span>

        <p id="radioMessageText">
          Choose a station whenever you’re ready to focus.
        </p>

      </section>

      <footer class="music-footer">

        <span>
          Listener-supported radio
        </span>

        <a
          id="stationLink"
          href="https://somafm.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Visit station ↗
        </a>

      </footer>

      <audio
        id="radioPlayer"
        preload="none"
      ></audio>

    </section>

  </main>

  <script
    src="../../js/focus-music-widget.js"
  ></script>

</body>
</html>
