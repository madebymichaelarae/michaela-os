<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Water Tracker | Michaela OS</title>

    <link
      rel="stylesheet"
      href="/css/themes.css"
    />

    <link
      rel="stylesheet"
      href="/css/health-water-widget.css"
    />
  </head>

  <body>
    <main
      class="health-water"
      data-theme="cozy-autumn"
    >
      <section
        class="health-water__card"
        aria-labelledby="water-widget-title"
      >
        <header class="health-water__header">
          <div>
            <p class="health-water__eyebrow">
              Health
            </p>

            <h1
              class="health-water__title"
              id="water-widget-title"
            >
              Water
            </h1>
          </div>

          <div
            class="health-water__icon"
            aria-hidden="true"
          >
            💧
          </div>
        </header>

        <div
          class="health-water__divider"
          aria-hidden="true"
        ></div>

        <section
          class="health-water__overview"
          aria-label="Today's water summary"
        >
          <p class="health-water__current">
            <span id="waterCurrent">—</span>

            <span class="health-water__unit">
              oz
            </span>
          </p>

          <div class="health-water__percentage-badge">
            <span
              class="health-water__percentage"
              id="waterPercentage"
            >
              0%
            </span>

            <span class="health-water__percentage-label">
              Daily goal
            </span>
          </div>
        </section>

        <section
          class="health-water__goal"
          aria-label="Daily water goal"
        >
          <div class="health-water__goal-copy">
            <span
              class="health-water__goal-label"
              id="waterGoalLabel"
            >
              Daily Goal: 72 oz
            </span>

            <span
              class="health-water__goal-separator"
              aria-hidden="true"
            ></span>

            <span
              class="health-water__remaining"
              id="waterRemaining"
            >
              Calculating…
            </span>
          </div>

          <div
            class="health-water__progress-track"
            role="progressbar"
            aria-label="Progress toward daily water goal"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div
              class="health-water__progress-bar"
              id="waterProgressBar"
            ></div>
          </div>

          <p
            class="health-water__recognition"
            id="waterRecognition"
          ></p>
        </section>

        <section
          class="health-water__history"
          aria-label="Water goal history"
        >
          <div class="health-water__history-item">
            <span class="health-water__history-label">
              This week
            </span>

            <strong
              class="health-water__history-value"
              id="waterWeekGoalCount"
            >
              Calculating…
            </strong>
          </div>

          <div
            class="health-water__history-divider"
            aria-hidden="true"
          ></div>

          <div class="health-water__history-item">
            <span class="health-water__history-label">
              Current streak
            </span>

            <strong
              class="health-water__history-value"
              id="waterCurrentStreak"
            >
              Calculating…
            </strong>
          </div>
        </section>

        <p
          class="health-water__error"
          id="waterError"
          hidden
        ></p>
      </section>
    </main>

    <script
      src="/js/water-chart.js"
      defer
    ></script>
  </body>
</html>
