<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Water Tracker | Michaela OS</title>

    <link
      rel="stylesheet"
      href="/css/themes.css"
    />

    <link
      rel="stylesheet"
      href="/css/styles.css"
    />
  </head>

  <body>
    <main
      class="health-widget health-water"
      data-theme="cozy-autumn"
    >
      <section
        class="health-widget__card"
        aria-labelledby="water-widget-title"
      >
        <header class="health-widget__header">
          <div class="health-widget__header-copy">
            <p class="health-widget__eyebrow">
              Health
            </p>

            <h1
              class="health-widget__title"
              id="water-widget-title"
            >
              Water
            </h1>

            <p class="health-widget__summary">
              Today’s hydration progress.
            </p>
          </div>

          <div
            class="health-widget__icon"
            aria-hidden="true"
          >
            💧
          </div>
        </header>

        <div
          class="health-widget__divider"
          aria-hidden="true"
        ></div>

        <section
          class="health-water__hero"
          aria-labelledby="waterGoalLabel"
        >
          <div class="health-water__amount-row">
            <div>
              <p
                class="health-widget__section-label"
                id="waterGoalLabel"
              >
                Today’s water
              </p>

              <p class="health-water__amount">
                <span id="waterCurrent">—</span>

                <span class="health-water__unit">
                  oz
                </span>
              </p>
            </div>

            <div class="health-water__percentage-block">
              <p class="health-widget__section-label">
                Goal progress
              </p>

              <p
                class="health-water__percentage-value"
                id="waterPercentage"
              >
                Loading…
              </p>
            </div>
          </div>

          <div
            class="health-widget__progress-track health-water__progress-track"
            role="progressbar"
            aria-label="Progress toward 72 ounce water goal"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div
              class="health-widget__progress-bar"
              id="waterProgressBar"
            ></div>
          </div>

          <div class="health-water__progress-footer">
            <p id="waterGoalProgress">
              Calculating…
            </p>

            <p>
              Daily goal: 72 oz
            </p>
          </div>
        </section>

        <section
          class="health-water__stats"
          aria-label="Water summary"
        >
          <article class="health-water__stat">
            <p class="health-widget__section-label">
              Remaining
            </p>

            <p
              class="health-water__stat-value"
              id="waterRemaining"
            >
              Calculating…
            </p>
          </article>

          <article class="health-water__stat">
            <p class="health-widget__section-label">
              Recognition
            </p>

            <p
              class="health-water__stat-value"
              id="waterRecognition"
            >
              Checking…
            </p>
          </article>

          <article class="health-water__stat">
            <p class="health-widget__section-label">
              Current streak
            </p>

            <p
              class="health-water__stat-value"
              id="waterCurrentStreak"
            >
              Calculating…
            </p>
          </article>
        </section>

        <footer class="health-widget__footer">
          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              This week
            </span>

            <strong
              class="health-widget__footer-value"
              id="waterWeekGoalCount"
            >
              Calculating…
            </strong>
          </div>

          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              This month
            </span>

            <strong
              class="health-widget__footer-value"
              id="waterMonthGoalCount"
            >
              Calculating…
            </strong>
          </div>

          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              Daily goal
            </span>

            <strong class="health-widget__footer-value">
              72 oz
            </strong>
          </div>
        </footer>
      </section>
    </main>

    <script
      src="/js/water-chart.js"
      defer
    ></script>
  </body>
</html>
