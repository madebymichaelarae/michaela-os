<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Weight Tracker | Michaela OS</title>

    <link
      rel="stylesheet"
      href="/css/themes.css"
    />

    <link
      rel="stylesheet"
      href="/css/health-weight-widget.css"
    />
  </head>

  <body>
    <main
      class="health-weight"
      data-theme="cozy-autumn"
    >
      <section
        class="health-weight__card"
        aria-labelledby="weight-widget-title"
      >
        <header class="health-weight__header">
          <div>
            <p class="health-weight__eyebrow">
              Health
            </p>

            <h1
              class="health-weight__title"
              id="weight-widget-title"
            >
              Weight
            </h1>
          </div>

          <div
            class="health-weight__icon"
            aria-hidden="true"
          >
            ⚖️
          </div>
        </header>

        <div
          class="health-weight__divider"
          aria-hidden="true"
        ></div>

        <section
          class="health-weight__overview"
          aria-label="Current weight summary"
        >
          <p class="health-weight__current">
            <span id="currentWeight">—</span>

            <span class="health-weight__unit">
              lb
            </span>
          </p>

          <div class="health-weight__change-badge">
            <span
              class="health-weight__change"
              id="weightChange"
            >
              Calculating…
            </span>

            <span class="health-weight__change-label">
              Overall change
            </span>
          </div>
        </section>

        <section
          class="health-weight__goal"
          aria-label="Current weight goal"
        >
          <div class="health-weight__goal-line">
            <div class="health-weight__goal-copy">
              <span
                class="health-weight__goal-label"
                id="weightGoalLabel"
              >
                Goal 1: 200 lbs
              </span>

              <span
                class="health-weight__goal-separator"
                aria-hidden="true"
              ></span>

              <span
                class="health-weight__goal-remaining"
                id="weightGoalRemaining"
              >
                Calculating…
              </span>
            </div>
          </div>

          <div class="health-weight__progress-row">
            <div
              class="health-weight__progress-track"
              role="progressbar"
              aria-label="Progress toward 200 pound goal"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div
                class="health-weight__progress-bar"
                id="weightProgressBar"
              ></div>
            </div>

            <span
              class="health-weight__progress-value"
              id="weightGoalDetails"
            >
              0%
            </span>
          </div>
        </section>

        <section
          class="health-weight__chart-panel"
          aria-labelledby="weight-chart-title"
        >
          <h2
            class="health-weight__chart-title"
            id="weight-chart-title"
          >
            Weight trend
          </h2>

          <div class="health-weight__chart-container">
            <canvas
              id="weightChart"
              role="img"
              aria-label="Line chart showing weight measurements over time."
            ></canvas>
          </div>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script
      src="/js/weight-chart.js"
      defer
    ></script>
  </body>
</html>
