<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Weight Tracker | Michaela OS</title>

    <link
      rel="stylesheet"
      href="/css/themes.css"
    />

    <link
      rel="stylesheet"
      href="/css/styles.css"
    />
  </head>

  <body>
    <main
      class="health-widget health-weight"
      data-theme="cozy-autumn"
    >
      <section
        class="health-widget__card"
        aria-labelledby="weight-widget-title"
      >
        <header class="health-widget__header">
          <div class="health-widget__header-copy">
            <p class="health-widget__eyebrow">
              Health
            </p>

            <h1
              class="health-widget__title"
              id="weight-widget-title"
            >
              Weight
            </h1>

            <p class="health-widget__summary">
              Tracking steady progress toward
              your next goal.
            </p>
          </div>

          <div
            class="health-widget__icon"
            aria-hidden="true"
          >
            ⚖️
          </div>
        </header>

        <div
          class="health-widget__divider"
          aria-hidden="true"
        ></div>

        <section
          class="health-weight__overview"
          aria-label="Current weight summary"
        >
          <div class="health-weight__primary">
            <p class="health-widget__section-label">
              Current weight
            </p>

            <p class="health-weight__current">
              <span id="currentWeight">—</span>

              <span class="health-weight__unit">
                lb
              </span>
            </p>
          </div>

          <div class="health-weight__change">
            <p class="health-widget__section-label">
              Overall change
            </p>

            <p
              class="health-weight__change-value"
              id="weightChange"
            >
              Calculating…
            </p>
          </div>
        </section>

        <section
          class="health-widget__goal"
          aria-labelledby="weightGoalLabel"
        >
          <div class="health-widget__goal-header">
            <div>
              <p
                class="health-widget__goal-title"
                id="weightGoalLabel"
              >
                Goal 1
              </p>

              <p
                class="health-widget__goal-copy"
                id="weightGoalRemaining"
              >
                Calculating goal…
              </p>
            </div>

            <p
              class="health-widget__goal-status"
              id="weightRecognition"
            >
              Checking progress…
            </p>
          </div>

          <div
            class="health-widget__progress-track"
            role="progressbar"
            aria-label="Progress toward 200 pound goal"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div
              class="health-widget__progress-bar"
              id="weightProgressBar"
            ></div>
          </div>

          <div class="health-widget__goal-footer">
            <p id="weightGoalDetails">
              Loading progress…
            </p>

            <p id="weightUpdated">
              Loading latest entry…
            </p>
          </div>
        </section>

        <section
          class="health-weight__chart-panel"
          aria-label="Weight history"
        >
          <div class="health-widget__panel-header">
            <div>
              <p class="health-widget__section-label">
                Trend
              </p>

              <h2 class="health-widget__panel-title">
                Weight history
              </h2>
            </div>
          </div>

          <div class="health-weight__chart-container">
            <canvas
              id="weightChart"
              role="img"
              aria-label="Line chart showing weight measurements over time."
            ></canvas>
          </div>
        </section>

        <footer class="health-widget__footer">
          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              Current
            </span>

            <strong
              class="health-widget__footer-value"
              id="weightFooterCurrent"
            >
              Latest entry
            </strong>
          </div>

          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              Progress
            </span>

            <strong class="health-widget__footer-value">
              Goal 200 lb
            </strong>
          </div>

          <div class="health-widget__footer-item">
            <span class="health-widget__footer-label">
              Recognition
            </span>

            <strong class="health-widget__footer-value">
              Keep going
            </strong>
          </div>
        </footer>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script
      src="/js/weight-chart.js"
      defer
    ></script>
  </body>
</html>
