<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Finance Header</title>

    <link
      rel="stylesheet"
      href="/css/system/cozy-autumn.css"
    />

    <link
      rel="stylesheet"
      href="/css/finance-header-widget.css"
    />
  </head>

  <body>
    <main
      class="finance-header widget-card"
      aria-labelledby="finance-title"
    >
      <section class="finance-header__section finance-header__identity">
        <div
          class="finance-header__icon widget-icon"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24">
            <circle
              cx="12"
              cy="12"
              r="8.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <path
              d="M14.8 8.6c-.7-.7-1.6-1-2.8-1-1.7 0-2.8.8-2.8 2s1 1.7 2.9 2.1c1.9.4 2.9 1 2.9 2.3 0 1.4-1.2 2.4-3 2.4-1.3 0-2.4-.4-3.2-1.2M12 5.8v12.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <div class="finance-header__copy">
          <p class="finance-header__eyebrow widget-eyebrow">
            Dashboard
          </p>

          <h1
            class="finance-header__title widget-title"
            id="finance-title"
          >
            Finance
          </h1>

          <p
            class="finance-header__quote widget-supporting-text"
            id="finance-quote"
          >
            Keep working, Michaela.
          </p>
        </div>
      </section>

      <section
        class="finance-header__section finance-header__available"
        aria-labelledby="available-label"
      >
        <p
          class="finance-header__label widget-eyebrow"
          id="available-label"
        >
          Available to Spend
        </p>

        <p
          class="finance-header__amount widget-primary-value"
          id="available-to-spend"
          aria-live="polite"
        >
          —
        </p>
      </section>

      <section class="finance-header__section finance-header__payday-wrap">
        <div
          class="finance-header__payday widget-accent-panel"
          aria-labelledby="payday-label"
        >
          <p
            class="finance-header__payday-label widget-eyebrow"
            id="payday-label"
          >
            Payday
          </p>

          <div class="finance-header__countdown">
            <span
              class="finance-header__days widget-secondary-value"
              id="payday-days"
            >
              —
            </span>

            <span
              class="finance-header__days-label widget-supporting-text"
              id="payday-days-label"
            >
              days
            </span>
          </div>

          <p
            class="finance-header__payday-date widget-supporting-text"
            id="payday-date"
          >
            Next payday
          </p>
        </div>
      </section>

      <div
        class="finance-header__error"
        id="finance-header-error"
        role="alert"
        hidden
      >
        Finance data could not be loaded.
      </div>
    </main>

    <script
      type="module"
      src="/js/finance-header-widget.js"
    ></script>
  </body>
</html>
